# ActorTemplate egress с образом из registry проверенного стенда.
# На другом стенде используй digest, опубликованный его bootstrap.
metadata:
  atespace: ate-demo-egress
  name: egress
workerSelector:
  matchLabels:
    workload: egress
containers:
- name: egress
  image: localhost:5001/egress@sha256:ea180a000d544136ef22942c701e86d0b972f0adbf35ebd00633e7a4ae1f0446
  command: ["/ko-app/egress"]
  env:
  - name: SSL_CERT_DIR
    value: /run/ate/egress-trust-bundle/
  volumeMounts:
  - name: system-info
    mountPath: /run/ate
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
volumes:
- name: system-info
  systemInfo:
    dataSources:
    # The trust anchors for the per-SNI leaves the egress gateway mints.
    # Only allowlisted bundle names resolve; this is the one supported today.
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        - system-roots.ate.dev
        path: egress-trust-bundle/trust-bundle.pem
# Sandbox size. The pool sets no worker limits, so the worker offers the
# node's allocatable and these only need to fit the node.
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912 # 512Mi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
